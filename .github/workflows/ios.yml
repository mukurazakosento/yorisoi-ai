name: Build iOS IPA

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS device
        run: |
          xcodebuild \
            -project YorisoiAI.xcodeproj \
            -scheme YorisoiAI \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          echo "Found app: $APP_PATH"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          zip -r YorisoiAI.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YorisoiAI-IPA
          path: YorisoiAI.ipa
